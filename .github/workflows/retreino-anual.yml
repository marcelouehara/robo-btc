name: Retreino anual do modelo

on:
  schedule:
    - cron: '0 9 2 1 *'   # 2 de janeiro, 06h de Brasília
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Só testar, sem trocar o modelo'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  retreino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r treino/requirements.txt
      - name: Treinar e testar
        run: python treino/treinar.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: Gravar modelo novo (se aprovado)
        run: |
          if ! git diff --quiet -- modelo_btc.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add modelo_btc.json
            git commit -m "Retreino anual: $(head -1 resumo_retreino.txt)"
            git push
          fi
      - name: Avisar no Telegram
        if: always()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TOKEN" ] && { echo "Sem TELEGRAM_BOT_TOKEN, pulando aviso"; exit 0; }
          MSG=$(cat resumo_retreino.txt 2>/dev/null || echo "Retreino do robô BTC falhou, veja o GitHub Actions.")
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" --data-urlencode "chat_id=${CHAT}" --data-urlencode "text=${MSG}"
